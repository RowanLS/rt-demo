[project]
name = "rt-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
